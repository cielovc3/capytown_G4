# === GANANCIAS DEL SIMULADOR (Referencia) ===
sim_recta_controller:
  ros__parameters:
    kp: 3.0
    ki: 0.5
    kd: 4.0

sim_cuadrado_controller:
  ros__parameters:
    odom_topic: "/odom"
    bias_w: 0.03
    kp: 3.0
    ki: 0.0
    kd: 4.0
    kp_yaw: 10.0
    ki_yaw: 0.0
    kd_yaw: 0.8
    linear_speed: 0.20
    max_angular: 1.00

# === GANANCIAS DEL ROBOT REAL (roscar6) ===
odom_corrector:
  ros__parameters:
    wheel_radius: 0.0322
    wheel_separation: 0.2307

recta_controller:
  ros__parameters:
    kp: 3.0
    ki: 0.05
    kd: 2.5

cuadrado_controller:
  ros__parameters:
    odom_topic: "/odom"
    bias_w: 0.0
    kp: 1.8
    ki: 0.0
    kd: 1.5
    kp_yaw: 4.5
    ki_yaw: 0.0
    kd_yaw: 0.8
    linear_speed: 0.10
    max_angular: 0.75
